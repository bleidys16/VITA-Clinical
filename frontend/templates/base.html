<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{% block title %}VITA Clinical{% endblock %}</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/custom.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236A4DD4'/><text x='16' y='23' text-anchor='middle' fill='white' font-size='20' font-weight='bold' font-family='Satoshi,sans-serif'>V</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <style>
        :root {
            --vita-jacarta: #000229;
            --vita-dark-blue-gray: #6A4DD4;
            --vita-wisteria: #CEB5D4;
            --vita-bright-gray: #E2ECF5;
            --vita-black-coffee: #000229;
            --vita-indigo-dark: #000229;
        }
        body {
            font-family: 'Satoshi', sans-serif;
            background-color: var(--vita-bright-gray);
            color: var(--vita-black-coffee);
            margin: 0;
            padding: 0;
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Satoshi', sans-serif; }
        .sidebar-vita {
            background: linear-gradient(135deg,
                #000229 0%, #000229 15%,
                #1a0a33 22%, #6E3377 35%,
                #6A4DD4 50%, #8a6ddd 62%,
                #CEB5D4 78%, #E2ECF5 100%
            );
            background-size: 150% 150%;
            color: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .nav-link-vita {
            color: rgba(255,255,255,0.7);
            transition: all 0.2s;
            border-radius: 6px;
        }
        .nav-link-vita:hover, .nav-link-vita.active {
            color: #fff;
            background-color: #6A4DD4;
        }
        .btn-vita-primary {
            background-color: #6A4DD4;
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 12px;
        }
        .btn-vita-primary:hover {
            background-color: #5a3db5;
            color: #fff;
        }
        .btn-vita-refresh {
            background-color: var(--vita-wisteria);
            color: var(--vita-black-coffee);
            font-weight: 700;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 12px;
            transition: opacity 0.1s;
        }
        .btn-vita-refresh:hover { opacity: 0.9; }
        .kpi-card-original {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 105px;
        }
        .kpi-card-original.critico { border-left: 5px solid #dc3545; }
        .kpi-card-original.hiper { border-left: 5px solid #ffc107; }
        .kpi-card-original.diab { border-left: 5px solid #0dcaf0; }
        .kpi-card-original.fuma { border-left: 5px solid #6c757d; }
        .kpi-info-box .kpi-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #6C757D;
            margin-bottom: 0.25rem;
        }
        .kpi-info-box .kpi-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--vita-black-coffee);
            line-height: 1;
        }
        .kpi-icon-box { font-size: 2rem; opacity: 0.8; }
        .chart-box-original {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .vita-card {
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .vita-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
