<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{% block title %}VITA Clinical{% endblock %}</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/custom.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236A4DD4'/><text x='16' y='23' text-anchor='middle' fill='white' font-size='20' font-weight='bold' font-family='Satoshi,sans-serif'>V</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <style>
        :root {
            --vita-jacarta: #000229;
            --vita-dark-blue-gray: #6A4DD4;
            --vita-wisteria: #CEB5D4;
            --vita-bright-gray: #E2ECF5;
            --vita-black-coffee: #000229;
            --vita-indigo-dark: #000229;
        }
        body {
            font-family: 'Satoshi', sans-serif;
            background-color: var(--vita-bright-gray);
            color: var(--vita-black-coffee);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Satoshi', sans-serif; }
        
        /* Layout */
        .app-wrapper {
            display: flex;
            min-height: 100vh;
            width: 100vw;
        }
        
        /* Sidebar */
        .sidebar-vita {
            width: 220px;
            min-height: 100vh;
            background: linear-gradient(135deg,
                #000229 0%, #000229 15%,
                #1a0a33 22%, #6E3377 35%,
                #6A4DD4 50%, #8a6ddd 62%,
                #CEB5D4 78%, #E2ECF5 100%
            );
            background-size: 150% 150%;
            color: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            flex-shrink: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .main-content {
            flex-grow: 1;
            padding: 1.5rem;
            max-height: 100vh;
            overflow-y: auto;
            background-color: var(--vita-bright-gray);
        }

        .nav-link-vita {
            color: rgba(255,255,255,0.7);
            padding: 0.6rem 0.8rem;
            margin: 0.15rem 0;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.2s;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .nav-link-vita:hover, .nav-link-vita.active {
            color: #fff;
            background-color: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
        }
        .nav-link-vita.active {
            background-color: #6A4DD4;
            box-shadow: 0 4px 12px rgba(106, 77, 212, 0.3);
        }

        .btn-vita-primary {
            background-color: #6A4DD4;
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            padding: 0.6rem 1.2rem;
            transition: all 0.2s;
        }
        .btn-vita-primary:hover {
            background-color: #5a3db5;
            color: #fff;
            transform: translateY(-1px);
        }
        
        /* Estilos de tarjetas y otros componentes */
        .vita-card {
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .vita-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block full_content %}
    <div class="app-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar-vita d-none d-md-flex flex-column p-4">
            <div class="brand-section mb-5 px-2">
                <div class="d-flex align-items-center gap-3">
                    <div class="brand-logo d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; background: rgba(255,255,255,0.1); border-radius: 10px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="var(--vita-wisteria)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1.5rem;height:1.5rem;"><circle cx="7" cy="5" r="2"/><circle cx="17" cy="5" r="2"/><path d="M7 7Q12 12 12 17"/><path d="M17 7Q12 12 12 17"/><circle cx="12" cy="20" r="2.8"/></svg>
                    </div>
                    <span class="fw-bold fs-4" style="font-family: 'Satoshi'; letter-spacing: -0.5px;">VITA</span>
                </div>
            </div>

            <nav class="nav flex-column flex-grow-1">
                <a href="/dashboard/" class="nav-link-vita" id="nav-dashboard">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </a>
                <a href="/analitica/" class="nav-link-vita" id="nav-analitica">
                    <i class="fa-solid fa-magnifying-glass-chart"></i> Analítica
                </a>
                <a href="/pacientes/" class="nav-link-vita" id="nav-pacientes">
                    <i class="fa-solid fa-user-group"></i> Pacientes
                </a>
                <a href="/ml-modeling/" class="nav-link-vita" id="nav-ml">
                    <i class="fa-solid fa-brain"></i> Predicción IA
                </a>
                <a href="/etl/" class="nav-link-vita" id="nav-etl">
                    <i class="fa-solid fa-database"></i> Control ETL
                </a>
                <a href="/usuarios/" class="nav-link-vita" id="nav-usuarios">
                    <i class="fa-solid fa-users-gear"></i> Usuarios
                </a>
            </nav>

            <div class="mt-auto pt-4 border-top border-white border-opacity-10">
                <div class="d-flex align-items-center gap-3 px-2 mb-4">
                    <div class="rounded-circle bg-light d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; color: var(--vita-indigo-dark);">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="overflow-hidden">
                        <div class="fw-bold small text-truncate" id="user-display-name">Usuario</div>
                        <div class="text-white-50" style="font-size: 0.7rem;" id="user-display-role">Cargando...</div>
                    </div>
                </div>
                <button class="btn btn-link nav-link-vita w-100 text-start border-0 bg-transparent" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('token_acceso');
            localStorage.removeItem('token_refresco');
            localStorage.removeItem('usuario_rol');
            window.location.href = '/login/';
        }

        // Cargar info de usuario si existe el token
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token_acceso');
            if (token) {
                try {
                    const response = await fetch('/api/etl/auth/me/', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        document.getElementById('user-display-name').textContent = data.username;
                        document.getElementById('user-display-role').textContent = data.rol;
                    }
                } catch (e) { console.error(e); }
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
